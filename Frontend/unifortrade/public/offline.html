<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — UniforTrade</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
      }
      main {
        padding: 2rem;
        max-width: 26rem;
      }
      .mark {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #475569;
        line-height: 1.5;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.4rem;
        border-radius: 0.5rem;
        border: none;
        background: #2563eb;
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        This page couldn't load without a connection. Listings and pages you've already visited
        are still available — try heading back to the listings or reconnecting to the internet.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
